[package]
name = "manifold-desktop"
version = "0.1.0"
description = "Manifold desktop application"
authors = ["Manifold"]
edition = "2021"

[lib]
name = "manifold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-util = "=0.3.31"
keyring = "=4.1.6"
reqwest = { version = "=0.13.4", default-features = false, features = ["cookies", "json", "native-tls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.6.0"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
url = "=2.5.8"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
