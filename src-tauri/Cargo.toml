[package]
name = "manifold-desktop"
version = "0.1.0"
description = "Manifold desktop application"
authors = ["Manifold"]
edition = "2021"

[lib]
name = "manifold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
url = "=2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
